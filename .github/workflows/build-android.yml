name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython
      - name: Clean build
        run: |
          buildozer android clean || true
      - name: Build APK
        run: |
          yes | buildozer android debug
      - name: Re-sign APK with stable key
        run: |
          BT=$(ls -d $HOME/.buildozer/android/platform/android-sdk/build-tools/* | tail -1)
          echo "using $BT"
          for apk in bin/*.apk; do
            "$BT/zipalign" -p 4 "$apk" "$apk.aligned"
            "$BT/apksigner" sign \
              --ks .keystore/sensei-debug.keystore \
              --ks-pass pass:sensei123 \
              --ks-key-alias sensei \
              --key-pass pass:sensei123 \
              "$apk.aligned"
            mv "$apk.aligned" "$apk"
            "$BT/apksigner" verify --print-certs "$apk" | head -3
          done
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: akane-apk
          path: bin/*.apk

  bundle:
    # Google Play requires new apps to be published as an App Bundle (.aab).
    # The debug APK is 137 MB, over the 100 MB limit for APK uploads.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython
      - name: Build signed App Bundle
        run: |
          yes | buildozer android release
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: akane-aab
          path: bin/*.aab
